spring.application.name=AgenticAiProject
server.port=8080

## ── OLLAMA LOCAL CONFIGURATION ──
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2

## ── DATABASE CONFIGURATION ──
spring.datasource.url=jdbc:mysql://localhost:3306/agentic_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## ── JPA CONFIGURATION ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000d